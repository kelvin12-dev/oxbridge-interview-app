  // -------------------- PAGE DIMENSIONS & RENDERING --------------------
  function getPageDimensions(nb, page) {
    const sizeObj = PRESETS.PAGE_SIZES.find(s => s.id === (nb.sizeId || 'goodnotes')) || PRESETS.PAGE_SIZES[0];
    let w = sizeObj.w;
    let h = sizeObj.h;
    if (nb.orientation === 'landscape') [w, h] = [h, w];
    if (page && (page.rotation === 90 || page.rotation === 270)) [w, h] = [h, w];
    if (page && page.pdfWidth && page.pdfHeight) {
      const aspect = page.pdfHeight / page.pdfWidth;
      w = 960;
      h = Math.round(960 * aspect);
    }
    return { w, h };
  }

  let bgCtx, dryCtx, wetCtx;
  let zoomDryCtx, zoomWetCtx;

  function initCanvasSystem() {
    bgCtx = $('bgCanvas').getContext('2d');
    dryCtx = $('dryCanvas').getContext('2d');
    wetCtx = $('wetCanvas').getContext('2d', { desynchronized: true }) || $('wetCanvas').getContext('2d');
    zoomDryCtx = $('zoomDryCanvas').getContext('2d');
    zoomWetCtx = $('zoomWetCanvas').getContext('2d', { desynchronized: true }) || $('zoomWetCanvas').getContext('2d');

    bindStagePointerEvents();
  }

  function renderActivePage(redrawBg = true) {
    const nb = getActiveNotebook();
    const page = getActivePage();
    if (!nb || !page) return;

    const { w, h } = getPageDimensions(nb, page);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const sheet = $('pageSheet');
    sheet.style.width = w + 'px';
    sheet.style.height = h + 'px';

    ['bgCanvas', 'dryCanvas', 'wetCanvas'].forEach(cid => {
      const c = $(cid);
      if (c.width !== w * dpr || c.height !== h * dpr) {
        c.width = w * dpr;
        c.height = h * dpr;
      }
    });

    if (redrawBg) renderBackgroundLayer(bgCtx, w, h, dpr, nb, page);
    renderDryLayer(dryCtx, w, h, dpr, page);
    renderDomOverlay(page);
    updatePageIndicators(nb, page);
    updateUndoRedoButtons(page);
    if (zoomWindowOn) syncZoomWindowCanvas();
  }

  function updatePageIndicators(nb, page) {
    $('pageIndicator').textContent = `Page ${activePageIndex + 1} / ${nb.pages.length}`;
    const isBm = !!page.bookmarked;
    $('btnBookmark').classList.toggle('active', isBm);
    $('bookmarkRibbonPath').setAttribute('fill', isBm ? '#e11d48' : 'rgba(148,163,184,0.35)');
  }

  function renderBackgroundLayer(ctx, w, h, dpr, nb, page) {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pColor = PRESETS.PAPER_COLORS.find(c => c.id === (page.paperColorId || nb.paperColorId || 'white')) || PRESETS.PAPER_COLORS[0];

    ctx.fillStyle = pColor.bg;
    ctx.fillRect(0, 0, w, h);

    if (page.pdfBg) {
      loadImg(page.pdfBg, (img) => {
        if (getActivePage()?.id === page.id) {
          ctx.save();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.drawImage(img, 0, 0, w, h);
          ctx.restore();
        }
      });
      ctx.restore();
      return;
    }

    drawTemplatePattern(ctx, w, h, page.templateId || 'ruled_narrow', pColor);
    ctx.restore();
  }

  function drawTemplatePattern(ctx, w, h, tpl, pColor) {
    ctx.strokeStyle = pColor.line;
    ctx.fillStyle = pColor.line;
    ctx.lineWidth = 1;

    if (tpl === 'blank') return;

    if (tpl === 'ruled_narrow' || tpl === 'ruled_wide' || tpl === 'legal') {
      const gap = tpl === 'ruled_wide' ? 38 : 28;
      if (tpl === 'legal') {
        ctx.fillStyle = pColor.id === 'dark' ? '#1f2318' : '#fef9c3';
        ctx.fillRect(0, 0, w, h);
      }
      ctx.beginPath();
      for (let y = 90; y < h - 30; y += gap) {
        ctx.moveTo(0, y); ctx.lineTo(w, y);
      }
      ctx.stroke();
      ctx.strokeStyle = pColor.margin;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(92, 0); ctx.lineTo(92, h);
      ctx.stroke();
      return;
    }

    if (tpl === 'cornell') {
      ctx.beginPath();
      for (let y = 130; y < h - 180; y += 30) {
        ctx.moveTo(220, y); ctx.lineTo(w - 24, y);
      }
      ctx.stroke();
      ctx.strokeStyle = pColor.margin;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 110); ctx.lineTo(w, 110);
      ctx.moveTo(210, 110); ctx.lineTo(210, h - 170);
      ctx.moveTo(0, h - 170); ctx.lineTo(w, h - 170);
      ctx.stroke();
      ctx.fillStyle = pColor.muted;
      ctx.font = '700 13px -apple-system, sans-serif';
      ctx.fillText('TOPIC / DATE', 24, 96);
      ctx.fillText('CUES & QUESTIONS', 24, 134);
      ctx.fillText('SUMMARY', 24, h - 146);
      return;
    }

    if (tpl === 'grid_5mm') {
      const step = 24;
      ctx.beginPath();
      for (let x = step; x < w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let y = step; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();
      return;
    }

    if (tpl === 'dotted') {
      const step = 26;
      for (let y = step; y < h; y += step) {
        for (let x = step; x < w; x += step) {
          ctx.fillRect(x - 1, y - 1, 2.2, 2.2);
        }
      }
      return;
    }

    if (tpl === 'isometric') {
      const step = 36;
      const dx = step * Math.cos(Math.PI / 6);
      const dy = step * Math.sin(Math.PI / 6);
      ctx.beginPath();
      for (let x = 0; x < w + h; x += dx) {
        ctx.moveTo(x, 0); ctx.lineTo(x - h * 1.732, h);
        ctx.moveTo(x - h, 0); ctx.lineTo(x + h * 0.732, h);
        ctx.moveTo(x, 0); ctx.lineTo(x, h);
      }
      ctx.stroke();
      return;
    }

    if (tpl === 'axes') {
      const step = 28;
      ctx.beginPath();
      for (let x = step; x < w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let y = step; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();
      const cx = Math.round(w / 2), cy = Math.round(h / 2);
      ctx.strokeStyle = pColor.inkDefault;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(30, cy); ctx.lineTo(w - 30, cy);
      ctx.moveTo(cx, 30); ctx.lineTo(cx, h - 30);
      ctx.stroke();
      ctx.fillStyle = pColor.inkDefault;
      ctx.font = 'italic 700 18px Georgia, serif';
      ctx.fillText('x', w - 42, cy - 12);
      ctx.fillText('y', cx + 14, 46);
      return;
    }

    if (tpl === 'monthly') {
      const pad = 42, top = 110, cols = 7, rows = 5;
      const cw = (w - pad * 2) / cols, ch = (h - top - 50) / rows;
      ctx.fillStyle = pColor.inkDefault;
      ctx.font = '800 26px -apple-system, sans-serif';
      ctx.fillText('MONTHLY PLANNER', pad, 72);
      const days = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
      ctx.font = '700 12px -apple-system, sans-serif';
      ctx.fillStyle = pColor.muted;
      days.forEach((d, i) => ctx.fillText(d, pad + i * cw + 8, top - 10));
      ctx.strokeStyle = pColor.line;
      ctx.lineWidth = 1.4;
      for (let r = 0; r <= rows; r++) {
        ctx.beginPath(); ctx.moveTo(pad, top + r * ch); ctx.lineTo(w - pad, top + r * ch); ctx.stroke();
      }
      for (let c = 0; c <= cols; c++) {
        ctx.beginPath(); ctx.moveTo(pad + c * cw, top); ctx.lineTo(pad + c * cw, top + rows * ch); ctx.stroke();
      }
      return;
    }

    if (tpl === 'weekly') {
      const pad = 42, top = 104;
      ctx.fillStyle = pColor.inkDefault;
      ctx.font = '800 24px -apple-system, sans-serif';
      ctx.fillText('WEEKLY STUDY PLANNER', pad, 68);
      const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', 'Weekly Goals'];
      const bw = (w - pad * 2 - 20) / 2, bh = (h - top - 60) / 4;
      days.forEach((d, i) => {
        const col = i % 2, row = Math.floor(i / 2);
        const x = pad + col * (bw + 20), y = top + row * (bh + 14);
        ctx.strokeStyle = pColor.line;
        ctx.lineWidth = 1.6;
        ctx.strokeRect(x, y, bw, bh);
        ctx.fillStyle = pColor.muted;
        ctx.font = '700 14px -apple-system, sans-serif';
        ctx.fillText(d, x + 12, y + 24);
        ctx.beginPath(); ctx.moveTo(x, y + 34); ctx.lineTo(x + bw, y + 34); ctx.stroke();
      });
      return;
    }

    if (tpl === 'daily' || tpl === 'todo') {
      const pad = 46;
      ctx.fillStyle = pColor.inkDefault;
      ctx.font = '800 24px -apple-system, sans-serif';
      ctx.fillText(tpl === 'daily' ? 'DAILY SCHEDULE & PRIORITIES' : 'TO-DO CHECKLIST', pad, 70);
      let y = 116;
      for (let i = 0; i < 18 && y < h - 40; i++) {
        if (tpl === 'daily') {
          ctx.fillStyle = pColor.muted;
          ctx.font = '600 13px -apple-system, sans-serif';
          ctx.fillText((6 + i) + ':00', pad, y - 6);
        } else {
          ctx.strokeStyle = pColor.muted;
          ctx.strokeRect(pad, y - 22, 18, 18);
        }
        ctx.strokeStyle = pColor.line;
        ctx.beginPath(); ctx.moveTo(pad + 54, y); ctx.lineTo(w - pad, y); ctx.stroke();
        y += 54;
      }
      return;
    }

    if (tpl === 'accounting' || tpl === 'columnar') {
      const cols = tpl === 'accounting' ? [60, 180, 560, 700, 830] : [60, 340, 620];
      ctx.beginPath();
      for (let y = 96; y < h - 40; y += 30) { ctx.moveTo(40, y); ctx.lineTo(w - 40, y); }
      ctx.stroke();
      ctx.strokeStyle = pColor.margin;
      ctx.beginPath();
      cols.forEach(cx => { ctx.moveTo(cx, 60); ctx.lineTo(cx, h - 40); });
      ctx.stroke();
      return;
    }

    if (tpl === 'music' || tpl === 'guitar') {
      const linesPerStaff = tpl === 'music' ? 5 : 6;
      const lineGap = tpl === 'music' ? 11 : 12;
      let y = 100;
      ctx.strokeStyle = pColor.muted;
      while (y + linesPerStaff * lineGap < h - 60) {
        ctx.beginPath();
        for (let l = 0; l < linesPerStaff; l++) {
          ctx.moveTo(48, y + l * lineGap); ctx.lineTo(w - 48, y + l * lineGap);
        }
        ctx.stroke();
        y += linesPerStaff * lineGap + 64;
      }
      return;
    }

    if (tpl === 'hex') {
      const r = 24;
      const dx = r * 1.5;
      const dy = r * Math.sqrt(3);
      ctx.beginPath();
      for (let col = 0; col * dx < w + r; col++) {
        for (let row = 0; row * dy < h + r; row++) {
          const cx = col * dx + 20;
          const cy = row * dy + (col % 2 ? dy / 2 : 0) + 20;
          for (let a = 0; a < 6; a++) {
            const ang = (Math.PI / 3) * a;
            const px = cx + r * Math.cos(ang), py = cy + r * Math.sin(ang);
            if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
        }
      }
      ctx.stroke();
    }
  }

  function loadImg(src, cb) {
    if (imgCache.has(src)) {
      const cached = imgCache.get(src);
      if (cached.complete) cb(cached);
      else cached.addEventListener('load', () => cb(cached), { once: true });
      return;
    }
    const img = new Image();
    img.onload = () => cb(img);
    img.src = src;
    imgCache.set(src, img);
  }

  function renderDryLayer(ctx, w, h, dpr, page) {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    // 1. Highlighters underneath ink (Goodnotes layering!)
    (page.strokes || []).filter(s => s.tool === 'highlighter').forEach(s => drawStroke(ctx, s));

    // 2. Elements / Images / Stickers
    (page.elements || []).forEach(el => {
      loadImg(el.src, (img) => {
        if (getActivePage()?.id === page.id) {
          ctx.save();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          drawElementObj(ctx, el, img);
          ctx.restore();
        }
      });
      const cached = imgCache.get(el.src);
      if (cached && cached.complete) drawElementObj(ctx, el, cached);
    });

    // 3. Pen & Shape strokes on top
    (page.strokes || []).filter(s => s.tool !== 'highlighter').forEach(s => {
      drawStroke(ctx, s);
      // Audio playback sync highlight glow
      if (activePlaybackClip && s.audioClipId === activePlaybackClip.id && audioEl) {
        const curMs = audioEl.currentTime * 1000;
        if (Math.abs((s.audioOffsetMs || 0) - curMs) < 1600) {
          ctx.save();
          ctx.strokeStyle = 'rgba(2, 132, 199, 0.35)';
          ctx.lineWidth = (s.width || 3) + 8;
          ctx.lineCap = 'round';
          drawPolyline(ctx, s.points);
          ctx.restore();
        }
      }
    });

    // 4. Study Tape Strips
    (page.tapes || []).forEach(tp => drawTapeStrip(ctx, tp));

    ctx.restore();
  }

  function drawElementObj(ctx, el, img) {
    ctx.save();
    const cx = el.x + el.w / 2, cy = el.y + el.h / 2;
    ctx.translate(cx, cy);
    if (el.rotation) ctx.rotate((el.rotation * Math.PI) / 180);
    ctx.drawImage(img, -el.w / 2, -el.h / 2, el.w, el.h);
    ctx.restore();
  }

  function drawTapeStrip(ctx, tp) {
    const st = PRESETS.TAPE_STYLES.find(x => x.id === tp.styleId) || PRESETS.TAPE_STYLES[0];
    ctx.save();
    if (tp.revealed) {
      ctx.strokeStyle = st.color;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.fillStyle = st.color + '18';
      ctx.fillRect(tp.x, tp.y, tp.w, tp.h);
      ctx.strokeRect(tp.x, tp.y, tp.w, tp.h);
    } else {
      ctx.fillStyle = st.color;
      ctx.fillRect(tp.x, tp.y, tp.w, tp.h);
      // Subtle diagonal stripe pattern
      ctx.strokeStyle = st.stripe;
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let x = tp.x - tp.h; x < tp.x + tp.w + tp.h; x += 14) {
        ctx.moveTo(x, tp.y + tp.h);
        ctx.lineTo(x + tp.h, tp.y);
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(tp.x, tp.y, tp.w, tp.h);
      ctx.clip();
      ctx.beginPath();
      for (let x = tp.x - tp.h; x < tp.x + tp.w + tp.h; x += 14) {
        ctx.moveTo(x, tp.y + tp.h);
        ctx.lineTo(x + tp.h, tp.y);
      }
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 11px -apple-system, sans-serif';
      ctx.fillText('TAP TO REVEAL', tp.x + 8, tp.y + tp.h / 2 + 4);
    }
    ctx.restore();
  }

  function drawStroke(ctx, s) {
    if (!s.points || s.points.length === 0) return;
    ctx.save();
    ctx.globalAlpha = s.opacity != null ? s.opacity : 1;
    ctx.strokeStyle = s.color || '#0f172a';
    ctx.fillStyle = s.color || '#0f172a';
    ctx.lineCap = s.tool === 'highlighter' ? 'butt' : 'round';
    ctx.lineJoin = 'round';

    if (s.shape) {
      drawShapeVector(ctx, s);
      ctx.restore();
      return;
    }

    const pts = s.points;
    if (pts.length === 1) {
      ctx.beginPath();
      ctx.arc(pts[0].x, pts[0].y, (s.width || 3) / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }

    if (s.tool === 'highlighter' || s.penType === 'ball') {
      ctx.lineWidth = s.width || 3;
      drawSmoothBezier(ctx, pts);
      ctx.restore();
      return;
    }

    // Variable-width Fountain / Brush Pen rendering
    const baseW = s.width || 3.5;
    const dynRange = s.penType === 'brush' ? 1.55 : 0.72;
    for (let i = 1; i < pts.length; i++) {
      const p0 = pts[i - 1], p1 = pts[i];
      const press = p1.p != null ? p1.p : 0.5;
      const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      const velFactor = s.penType === 'fountain' ? Math.max(0.55, Math.min(1.25, 1.15 - dist * 0.015)) : 1;
      const w = Math.max(1, baseW * (0.55 + press * dynRange) * velFactor);
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSmoothBezier(ctx, pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.stroke();
  }

  function drawPolyline(ctx, pts) {
    if (!pts.length) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function drawShapeVector(ctx, s) {
    const sh = s.shape;
    ctx.lineWidth = s.width || 3;
    if (sh.fill) {
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = s.color;
      traceShapePath(ctx, sh);
      ctx.fill();
      ctx.restore();
    }
    traceShapePath(ctx, sh);
    ctx.stroke();

    if (sh.kind === 'arrow') {
      const ang = Math.atan2(sh.y2 - sh.y1, sh.x2 - sh.x1);
      const head = Math.max(12, (s.width || 3) * 4);
      ctx.beginPath();
      ctx.moveTo(sh.x2, sh.y2);
      ctx.lineTo(sh.x2 - head * Math.cos(ang - 0.45), sh.y2 - head * Math.sin(ang - 0.45));
      ctx.moveTo(sh.x2, sh.y2);
      ctx.lineTo(sh.x2 - head * Math.cos(ang + 0.45), sh.y2 - head * Math.sin(ang + 0.45));
      ctx.stroke();
    }
  }

  function traceShapePath(ctx, sh) {
    ctx.beginPath();
    if (sh.kind === 'line' || sh.kind === 'arrow') {
      ctx.moveTo(sh.x1, sh.y1); ctx.lineTo(sh.x2, sh.y2);
    } else if (sh.kind === 'rect') {
      ctx.rect(sh.x, sh.y, sh.w, sh.h);
    } else if (sh.kind === 'ellipse') {
      ctx.ellipse(sh.cx, sh.cy, Math.max(2, sh.rx), Math.max(2, sh.ry), 0, 0, Math.PI * 2);
    } else if (sh.kind === 'triangle') {
      ctx.moveTo(sh.x + sh.w / 2, sh.y);
      ctx.lineTo(sh.x + sh.w, sh.y + sh.h);
      ctx.lineTo(sh.x, sh.y + sh.h);
      ctx.closePath();
    } else if (sh.kind === 'diamond') {
      ctx.moveTo(sh.x + sh.w / 2, sh.y);
      ctx.lineTo(sh.x + sh.w, sh.y + sh.h / 2);
      ctx.lineTo(sh.x + sh.w / 2, sh.y + sh.h);
      ctx.lineTo(sh.x, sh.y + sh.h / 2);
      ctx.closePath();
    } else if (sh.kind === 'axes') {
      const mx = sh.x + sh.w / 2, my = sh.y + sh.h / 2;
      ctx.moveTo(sh.x, my); ctx.lineTo(sh.x + sh.w, my);
      ctx.moveTo(mx, sh.y); ctx.lineTo(mx, sh.y + sh.h);
    }
  }

  // -------------------- ZERO-DELAY POINTER ENGINE --------------------
  let activePointers = new Map();
  let isPanZooming = false;
  let lastPinchDist = 0;
  let lastPinchCenter = null;

  let activeStroke = null;
  let drawHoldTimer = null;
  let snappedShape = null;
  let activeTapeDrag = null;
  let activePanTouch = null;
  let laserTrail = [];
  let laserRaf = 0;
  let lastEraserPos = null;

  function toPageCoords(clientX, clientY) {
    const rect = $('pageSheet').getBoundingClientRect();
    const { w, h } = getPageDimensions(getActiveNotebook(), getActivePage());
    return {
      x: ((clientX - rect.left) / rect.width) * w,
      y: ((clientY - rect.top) / rect.height) * h
    };
  }

  function bindStagePointerEvents() {
    const stage = $('canvasStage');
    const wet = $('wetCanvas');

    // Pinch-to-zoom & two-finger pan at stage level
    stage.addEventListener('pointerdown', (e) => {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
      if (activePointers.size === 2) {
        isPanZooming = true;
        cancelActiveStroke();
        const pts = Array.from(activePointers.values());
        lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        lastPinchCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      }
    });

    stage.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
      if (activePointers.size === 2 && isPanZooming) {
        const pts = Array.from(activePointers.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const center = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        const dx = center.x - lastPinchCenter.x;
        const dy = center.y - lastPinchCenter.y;
        const factor = lastPinchDist > 10 ? dist / lastPinchDist : 1;
        applyZoomAroundPoint(viewScale * factor, center.x, center.y, dx, dy);
        lastPinchDist = dist;
        lastPinchCenter = center;
      }
    });

    const cleanupPtr = (e) => {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) isPanZooming = false;
    };
    stage.addEventListener('pointerup', cleanupPtr);
    stage.addEventListener('pointercancel', cleanupPtr);

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        applyZoomAroundPoint(viewScale * factor, e.clientX, e.clientY, 0, 0);
      } else {
        viewPanX -= e.deltaX;
        viewPanY -= e.deltaY;
        applyViewportTransform();
      }
    }, { passive: false });

    // Primary Zero-Delay Drawing Events on wetCanvas
    wet.addEventListener('pointerdown', onWetPointerDown);
    if ('onpointerrawupdate' in window) {
      wet.addEventListener('pointerrawupdate', onWetPointerMove);
    } else {
      wet.addEventListener('pointermove', onWetPointerMove);
    }
    wet.addEventListener('pointerup', onWetPointerUp);
    wet.addEventListener('pointercancel', onWetPointerUp);
  }

  function applyViewportTransform() {
    $('canvasViewport').style.transform = `translate3d(${viewPanX}px, ${viewPanY}px, 0) scale(${viewScale})`;
    $('zoomPctLabel').textContent = Math.round(viewScale * 100) + '%';
  }

  window.fitPageToStage = function () {
    const nb = getActiveNotebook(), page = getActivePage();
    if (!nb || !page) return;
    const { w, h } = getPageDimensions(nb, page);
    const rect = $('canvasStage').getBoundingClientRect();
    if (!rect.width) return;
    const pad = 28;
    viewScale = Math.min((rect.width - pad) / w, (rect.height - pad) / h, 1.35);
    viewScale = Math.max(0.28, viewScale);
    viewPanX = Math.round((rect.width - w * viewScale) / 2);
    viewPanY = Math.round(Math.max(14, (rect.height - h * viewScale) / 2));
    applyViewportTransform();
  };

  window.adjustZoom = function (delta) {
    const rect = $('canvasStage').getBoundingClientRect();
    applyZoomAroundPoint(viewScale + delta, rect.left + rect.width / 2, rect.top + rect.height / 2, 0, 0);
  };

  function applyZoomAroundPoint(newScale, clientX, clientY, dx, dy) {
    newScale = Math.max(0.25, Math.min(4.5, newScale));
    const stageRect = $('canvasStage').getBoundingClientRect();
    const sx = clientX - stageRect.left;
    const sy = clientY - stageRect.top;
    const ratio = newScale / viewScale;
    viewPanX = sx - (sx - viewPanX) * ratio + dx;
    viewPanY = sy - (sy - viewPanY) * ratio + dy;
    viewScale = newScale;
    applyViewportTransform();
  }

  function cancelActiveStroke() {
    clearTimeout(drawHoldTimer);
    activeStroke = null;
    snappedShape = null;
    activeTapeDrag = null;
    activePanTouch = null;
    clearWetCanvas();
  }

  function clearWetCanvas() {
    const c = $('wetCanvas');
    wetCtx.save();
    wetCtx.setTransform(1, 0, 0, 1, 0, 0);
    wetCtx.clearRect(0, 0, c.width, c.height);
    wetCtx.restore();
  }

  function onWetPointerDown(e) {
    if (isPanZooming || activePointers.size > 1) return;
    closePopover();
    const page = getActivePage();
    if (!page) return;

    const pt = toPageCoords(e.clientX, e.clientY);

    // Read-Only Mode or Palm-Rejected Finger Touch: allow Study Tape toggling, Audio Seek, or 1-finger panning!
    if (readOnlyMode || (settings.pencilOnly && e.pointerType === 'touch')) {
      if (tryToggleTapeAt(page, pt.x, pt.y)) return;
      if (activePlaybackClip && seekAudioToStrokeAt(page, pt.x, pt.y)) return;
      e.target.setPointerCapture(e.pointerId);
      activePanTouch = { id: e.pointerId, lastX: e.clientX, lastY: e.clientY };
      return;
    }

    if (activeTool === 'text') {
      createTextBoxAt(pt.x, pt.y);
      return;
    }

    if (activeTool === 'tape') {
      if (tryToggleTapeAt(page, pt.x, pt.y)) return;
      e.target.setPointerCapture(e.pointerId);
      activeTapeDrag = { x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y };
      return;
    }

    if (activeTool === 'laser') {
      e.target.setPointerCapture(e.pointerId);
      laserTrail = [{ x: pt.x, y: pt.y, t: performance.now() }];
      startLaserLoop();
      return;
    }

    if (activeTool === 'eraser') {
      e.target.setPointerCapture(e.pointerId);
      pushPageHistory(page);
      lastEraserPos = pt;
      eraseAtPoint(page, pt);
      return;
    }

    // Pen, Highlighter, Shape, or Lasso
    e.target.setPointerCapture(e.pointerId);
    const p = e.pressure > 0 ? e.pressure : 0.5;
    const snapped = snapPointToRulerIfNear(pt);

    activeStroke = {
      id: uid('st'),
      tool: activeTool,
      penType: activeTool === 'pen' ? settings.penType : (activeTool === 'highlighter' ? 'highlighter' : 'ball'),
      color: activeTool === 'highlighter' ? settings.hlColor : settings.penColor,
      width: activeTool === 'highlighter' ? settings.hlSize : settings.penSize,
      opacity: activeTool === 'highlighter' ? 0.38 : 1,
      points: [{ x: snapped.x, y: snapped.y, p }],
      audioClipId: activeRecordingClipId || null,
      audioOffsetMs: activeRecordingClipId ? Math.round(performance.now() - recStartTime) : null
    };
    snappedShape = null;

    if (activeTool === 'pen' && settings.drawAndHold) {
      resetDrawAndHoldTimer();
    }
    renderWetPreview();
  }

  function onWetPointerMove(e) {
    if (isPanZooming || activePointers.size > 1) return;
    if (activePanTouch && e.pointerId === activePanTouch.id) {
      viewPanX += e.clientX - activePanTouch.lastX;
      viewPanY += e.clientY - activePanTouch.lastY;
      activePanTouch.lastX = e.clientX;
      activePanTouch.lastY = e.clientY;
      applyViewportTransform();
      return;
    }
    const page = getActivePage();
    if (!page) return;

    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];

    if (activeTapeDrag) {
      const pt = toPageCoords(e.clientX, e.clientY);
      activeTapeDrag.x1 = pt.x;
      activeTapeDrag.y1 = pt.y;
      renderWetTapePreview();
      return;
    }

    if (activeTool === 'laser' && (e.buttons > 0 || e.pressure > 0)) {
      const pt = toPageCoords(e.clientX, e.clientY);
      if (settings.laserType === 'dot') laserTrail = [{ x: pt.x, y: pt.y, t: performance.now() }];
      else laserTrail.push({ x: pt.x, y: pt.y, t: performance.now() });
      return;
    }

    if (activeTool === 'eraser' && lastEraserPos) {
      for (const ev of events) {
        const pt = toPageCoords(ev.clientX, ev.clientY);
        eraseSegment(page, lastEraserPos, pt);
        lastEraserPos = pt;
      }
      renderDryCurrent();
      return;
    }

    if (!activeStroke) return;

    for (const ev of events) {
      const rawPt = toPageCoords(ev.clientX, ev.clientY);
      let pt = snapPointToRulerIfNear(rawPt);
      const pts = activeStroke.points;
      const last = pts[pts.length - 1];

      // Straight-line Highlighter mode
      if (activeTool === 'highlighter' && settings.highlighterStraight) {
        activeStroke.points = [pts[0], pt];
        break;
      }

      // Dedicated Shape Tool preview
      if (activeTool === 'shape') {
        activeStroke.points = [pts[0], pt];
        snappedShape = buildShapeFromDrag(pts[0], pt, settings.shapeType, settings.shapeFill);
        break;
      }

      // Streamline Stabilization
      const stab = activeTool === 'pen' ? settings.stabilization : 0.2;
      const alpha = 1 - stab * 0.72;
      const sx = last.x + (pt.x - last.x) * alpha;
      const sy = last.y + (pt.y - last.y) * alpha;
      const dist = Math.hypot(sx - last.x, sy - last.y);
      if (dist >= 1.2) {
        pts.push({ x: sx, y: sy, p: ev.pressure > 0 ? ev.pressure : 0.5 });
        if (activeTool === 'pen' && settings.drawAndHold && dist > 4) {
          snappedShape = null;
          resetDrawAndHoldTimer();
        }
      }
    }

    // Predicted events for 0ms visual lead
    let predicted = null;
    if (e.getPredictedEvents && activeTool === 'pen' && !snappedShape) {
      const predEvs = e.getPredictedEvents();
      if (predEvs && predEvs.length) {
        predicted = predEvs.map(pe => {
          const pp = toPageCoords(pe.clientX, pe.clientY);
          return { x: pp.x, y: pp.y, p: pe.pressure > 0 ? pe.pressure : 0.5 };
        });
      }
    }

    renderWetPreview(predicted);
  }

  function onWetPointerUp(e) {
    clearTimeout(drawHoldTimer);
    if (activePanTouch && e.pointerId === activePanTouch.id) {
      activePanTouch = null;
      return;
    }
    const page = getActivePage();
    if (!page) return;

    if (activeTapeDrag) {
      const x = Math.min(activeTapeDrag.x0, activeTapeDrag.x1);
      const y = Math.min(activeTapeDrag.y0, activeTapeDrag.y1);
      const w = Math.max(40, Math.abs(activeTapeDrag.x1 - activeTapeDrag.x0));
      const h = Math.max(24, Math.abs(activeTapeDrag.y1 - activeTapeDrag.y0));
      pushPageHistory(page);
      page.tapes.push({ id: uid('tp'), x, y, w, h, styleId: settings.tapeStyleId, revealed: false });
      activeTapeDrag = null;
      clearWetCanvas();
      renderDryCurrent();
      scheduleSaveLibrary();
      return;
    }

    if (activeTool === 'eraser' && lastEraserPos) {
      lastEraserPos = null;
      scheduleSaveLibrary();
      if (settings.eraserAutoDeselect) selectTool(prevToolBeforeEraser);
      return;
    }

    if (!activeStroke) return;
    const stroke = activeStroke;
    activeStroke = null;
    clearWetCanvas();

    if (stroke.tool === 'lasso') {
      snappedShape = null;
      performLassoSelection(page, stroke.points);
      return;
    }

    if (snappedShape) {
      stroke.shape = snappedShape;
      snappedShape = null;
    } else if (stroke.tool === 'pen') {
      // Check Scribble-to-Erase gesture
      if (settings.scribbleToErase && isScribbleGesture(stroke.points)) {
        const erased = eraseStrokesIntersectingBox(page, getPointsBounds(stroke.points));
        if (erased > 0) {
          haptic('medium');
          renderDryCurrent();
          scheduleSaveLibrary();
          showToast(`Scribble erased ${erased} stroke${erased > 1 ? 's' : ''}`);
          return;
        }
      }
      // Check Circle-to-Lasso gesture
      if (settings.circleToLasso && isCircleLassoGesture(page, stroke.points)) {
        haptic('selection');
        performLassoSelection(page, stroke.points);
        return;
      }
    }

    pushPageHistory(page);
    page.strokes.push(stroke);
    const nb = getActiveNotebook();
    if (nb) nb.updatedAt = Date.now();
    renderDryCurrent();
    if (zoomWindowOn) syncZoomWindowCanvas();
    scheduleSaveLibrary();
  }

  function renderWetPreview(predicted = null) {
    const nb = getActiveNotebook(), page = getActivePage();
    if (!nb || !page || !activeStroke) return;
    const { w, h } = getPageDimensions(nb, page);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    wetCtx.save();
    wetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wetCtx.clearRect(0, 0, w, h);

    if (activeStroke.tool === 'lasso') {
      wetCtx.strokeStyle = '#0284c7';
      wetCtx.lineWidth = 2;
      wetCtx.setLineDash([6, 5]);
      if (settings.lassoMode === 'rect' && activeStroke.points.length >= 2) {
        const p0 = activeStroke.points[0], p1 = activeStroke.points[activeStroke.points.length - 1];
        wetCtx.strokeRect(Math.min(p0.x, p1.x), Math.min(p0.y, p1.y), Math.abs(p1.x - p0.x), Math.abs(p1.y - p0.y));
      } else {
        drawPolyline(wetCtx, activeStroke.points);
      }
    } else if (snappedShape) {
      drawStroke(wetCtx, Object.assign({}, activeStroke, { shape: snappedShape }));
    } else {
      const renderObj = predicted ? Object.assign({}, activeStroke, { points: activeStroke.points.concat(predicted) }) : activeStroke;
      drawStroke(wetCtx, renderObj);
    }
    wetCtx.restore();
  }

  function renderWetTapePreview() {
    const nb = getActiveNotebook(), page = getActivePage();
    if (!nb || !page || !activeTapeDrag) return;
    const { w, h } = getPageDimensions(nb, page);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    wetCtx.save();
    wetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wetCtx.clearRect(0, 0, w, h);
    drawTapeStrip(wetCtx, {
      x: Math.min(activeTapeDrag.x0, activeTapeDrag.x1),
      y: Math.min(activeTapeDrag.y0, activeTapeDrag.y1),
      w: Math.max(40, Math.abs(activeTapeDrag.x1 - activeTapeDrag.x0)),
      h: Math.max(24, Math.abs(activeTapeDrag.y1 - activeTapeDrag.y0)),
      styleId: settings.tapeStyleId,
      revealed: false
    });
    wetCtx.restore();
  }

  function renderDryCurrent() {
    const nb = getActiveNotebook(), page = getActivePage();
    if (!nb || !page) return;
    const { w, h } = getPageDimensions(nb, page);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderDryLayer(dryCtx, w, h, dpr, page);
  }

  // -------------------- DRAW & HOLD SHAPE RECOGNITION --------------------
  function resetDrawAndHoldTimer() {
    clearTimeout(drawHoldTimer);
    drawHoldTimer = setTimeout(() => {
      if (!activeStroke || activeStroke.points.length < 6) return;
      const detected = detectShapeFromStroke(activeStroke.points, settings.shapeFill);
      if (detected) {
        snappedShape = detected;
        haptic('medium');
        renderWetPreview();
      }
    }, 420);
  }

  function detectShapeFromStroke(pts, fill) {
    const b = getPointsBounds(pts);
    const p0 = pts[0], pLast = pts[pts.length - 1];
    const endDist = Math.hypot(pLast.x - p0.x, pLast.y - p0.y);
    const totalLen = pathLength(pts);
    const diag = Math.hypot(b.w, b.h);
    if (totalLen < 24) return null;

    // Straight line
    if (endDist / totalLen > 0.90) {
      return { kind: 'line', x1: p0.x, y1: p0.y, x2: pLast.x, y2: pLast.y, fill: false };
    }
    // Closed shapes
    if (endDist < Math.max(36, diag * 0.28)) {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const rx = b.w / 2, ry = b.h / 2;
      let radialVar = 0;
      pts.forEach(pt => {
        const nx = (pt.x - cx) / Math.max(1, rx);
        const ny = (pt.y - cy) / Math.max(1, ry);
        radialVar += Math.abs(Math.hypot(nx, ny) - 1);
      });
      radialVar /= pts.length;
      if (radialVar < 0.21) {
        if (Math.abs(b.w - b.h) / Math.max(b.w, b.h) < 0.2) {
          const r = (rx + ry) / 2;
          return { kind: 'ellipse', cx, cy, rx: r, ry: r, fill };
        }
        return { kind: 'ellipse', cx, cy, rx, ry, fill };
      }
      // Triangle vs Rectangle heuristic by top-row width vs bottom-row width
      const topPts = pts.filter(p => p.y < b.y + b.h * 0.28);
      const topSpan = topPts.length ? (Math.max(...topPts.map(p => p.x)) - Math.min(...topPts.map(p => p.x))) : b.w;
      if (topSpan < b.w * 0.48) {
        return { kind: 'triangle', x: b.x, y: b.y, w: b.w, h: b.h, fill };
      }
      return { kind: 'rect', x: b.x, y: b.y, w: b.w, h: b.h, fill };
    }
    return null;
  }

  function buildShapeFromDrag(p0, p1, kind, fill) {
    const x = Math.min(p0.x, p1.x), y = Math.min(p0.y, p1.y);
    const w = Math.abs(p1.x - p0.x), h = Math.abs(p1.y - p0.y);
    if (kind === 'auto' || kind === 'line') return { kind: 'line', x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, fill: false };
    if (kind === 'arrow') return { kind: 'arrow', x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, fill: false };
    if (kind === 'ellipse') return { kind: 'ellipse', cx: x + w / 2, cy: y + h / 2, rx: w / 2, ry: h / 2, fill };
    return { kind, x, y, w, h, fill };
  }

  // -------------------- SCRIBBLE TO ERASE & CIRCLE TO LASSO --------------------
  function isScribbleGesture(pts) {
    if (pts.length < 14) return false;
    const b = getPointsBounds(pts);
    if (b.w < 16 || b.h < 8 || b.w > 260) return false;
    let reversals = 0;
    let prevDx = 0;
    for (let i = 2; i < pts.length; i += 2) {
      const dx = pts[i].x - pts[i - 2].x;
      if (Math.abs(dx) > 2) {
        if (prevDx !== 0 && Math.sign(dx) !== Math.sign(prevDx)) reversals++;
        prevDx = dx;
      }
    }
    return reversals >= 3;
  }

  function isCircleLassoGesture(page, pts) {
    if (pts.length < 18) return false;
    const p0 = pts[0], pLast = pts[pts.length - 1];
    const b = getPointsBounds(pts);
    if (Math.hypot(pLast.x - p0.x, pLast.y - p0.y) > 32) return false;
    if (b.w < 40 || b.h < 40) return false;
    // Trigger only if enclosing at least 1 stroke or element so drawing normal circles works!
    const hasInside = (page.strokes || []).some(s => boxesIntersect(b, getStrokeBounds(s)));
    return hasInside && pathLength(pts) > 140;
  }

  function eraseStrokesIntersectingBox(page, box) {
    const before = page.strokes.length;
    const kept = page.strokes.filter(s => !boxesIntersect(box, getStrokeBounds(s)));
    const removed = before - kept.length;
    if (removed > 0) {
      pushPageHistory(page);
      page.strokes = kept;
    }
    return removed;
  }

  // -------------------- ERASER ENGINE --------------------
  function eraseAtPoint(page, pt) {
    eraseSegment(page, pt, pt);
    renderDryCurrent();
  }

  function eraseSegment(page, a, b) {
    const r = settings.eraserSize;
    const nextStrokes = [];
    for (const s of page.strokes) {
      if (settings.eraserHighlighterOnly && s.tool !== 'highlighter') {
        nextStrokes.push(s);
        continue;
      }
      if (s.shape) {
        const sb = getStrokeBounds(s);
        if (pointInBox(a, sb, r) || pointInBox(b, sb, r)) continue;
        nextStrokes.push(s);
        continue;
      }
      if (settings.eraserMode === 'stroke') {
        const hit = s.points.some(p => distToSegment(p, a, b) <= r + (s.width || 3) / 2);
        if (!hit) nextStrokes.push(s);
      } else {
        // Precision / Standard Eraser splits strokes cleanly at eraser intersection
        let curSeg = [];
        for (const p of s.points) {
          if (distToSegment(p, a, b) <= r + (s.width || 3) / 2) {
            if (curSeg.length >= 2) {
              nextStrokes.push(Object.assign({}, s, { id: uid('st'), points: curSeg }));
            }
            curSeg = [];
          } else {
            curSeg.push(p);
          }
        }
        if (curSeg.length >= 2) {
          nextStrokes.push(Object.assign({}, s, { id: uid('st'), points: curSeg }));
        }
      }
    }
    page.strokes = nextStrokes;
    if (!settings.eraserHighlighterOnly && page.tapes && page.tapes.length) {
      page.tapes = page.tapes.filter(tp => !(pointInBox(a, tp, r) || pointInBox(b, tp, r)));
    }
  }

  // -------------------- LASSO SELECTION & FLOATING ACTIONS --------------------
  function performLassoSelection(page, pts) {
    const b = getPointsBounds(pts);
    if (b.w < 10 || b.h < 10) { currentSelection = null; renderDomOverlay(page); return; }

    const strokeIds = settings.lassoFilterInk
      ? page.strokes.filter(s => boxesIntersect(b, getStrokeBounds(s))).map(s => s.id) : [];
    const textIds = settings.lassoFilterText
      ? (page.texts || []).filter(t => boxesIntersect(b, { x: t.x, y: t.y, w: t.w || 180, h: 60 })).map(t => t.id) : [];
    const elemIds = settings.lassoFilterElem
      ? (page.elements || []).filter(el => boxesIntersect(b, { x: el.x, y: el.y, w: el.w, h: el.h })).map(el => el.id) : [];

    if (!strokeIds.length && !textIds.length && !elemIds.length) {
      currentSelection = null;
      renderDomOverlay(page);
      showToast('Nothing inside selection');
      return;
    }

    currentSelection = { rect: computeSelectionBounds(page, strokeIds, textIds, elemIds), strokeIds, textIds, elemIds };
    renderDomOverlay(page);
  }

  function computeSelectionBounds(page, strokeIds, textIds, elemIds) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    page.strokes.filter(s => strokeIds.includes(s.id)).forEach(s => {
      const sb = getStrokeBounds(s);
      minX = Math.min(minX, sb.x); minY = Math.min(minY, sb.y);
      maxX = Math.max(maxX, sb.x + sb.w); maxY = Math.max(maxY, sb.y + sb.h);
    });
    (page.texts || []).filter(t => textIds.includes(t.id)).forEach(t => {
      minX = Math.min(minX, t.x); minY = Math.min(minY, t.y);
      maxX = Math.max(maxX, t.x + (t.w || 220)); maxY = Math.max(maxY, t.y + 60);
    });
    (page.elements || []).filter(el => elemIds.includes(el.id)).forEach(el => {
      minX = Math.min(minX, el.x); minY = Math.min(minY, el.y);
      maxX = Math.max(maxX, el.x + el.w); maxY = Math.max(maxY, el.y + el.h);
    });
    return { x: minX - 8, y: minY - 8, w: Math.max(40, maxX - minX + 16), h: Math.max(40, maxY - minY + 16) };
  }

  function moveSelectionBy(page, dx, dy) {
    if (!currentSelection) return;
    page.strokes.filter(s => currentSelection.strokeIds.includes(s.id)).forEach(s => {
      s.points.forEach(p => { p.x += dx; p.y += dy; });
      if (s.shape) {
        if ('x1' in s.shape) { s.shape.x1 += dx; s.shape.y1 += dy; s.shape.x2 += dx; s.shape.y2 += dy; }
        if ('cx' in s.shape) { s.shape.cx += dx; s.shape.cy += dy; }
        if ('x' in s.shape) { s.shape.x += dx; s.shape.y += dy; }
      }
    });
    (page.texts || []).filter(t => currentSelection.textIds.includes(t.id)).forEach(t => { t.x += dx; t.y += dy; });
    (page.elements || []).filter(el => currentSelection.elemIds.includes(el.id)).forEach(el => { el.x += dx; el.y += dy; });
    currentSelection.rect.x += dx;
    currentSelection.rect.y += dy;
  }

  function scaleSelection(page, factorX, factorY) {
    if (!currentSelection) return;
    const ox = currentSelection.rect.x, oy = currentSelection.rect.y;
    page.strokes.filter(s => currentSelection.strokeIds.includes(s.id)).forEach(s => {
      s.points.forEach(p => {
        p.x = ox + (p.x - ox) * factorX;
        p.y = oy + (p.y - oy) * factorY;
      });
      if (s.shape) {
        if ('x1' in s.shape) {
          s.shape.x1 = ox + (s.shape.x1 - ox) * factorX; s.shape.y1 = oy + (s.shape.y1 - oy) * factorY;
          s.shape.x2 = ox + (s.shape.x2 - ox) * factorX; s.shape.y2 = oy + (s.shape.y2 - oy) * factorY;
        }
        if ('cx' in s.shape) {
          s.shape.cx = ox + (s.shape.cx - ox) * factorX; s.shape.cy = oy + (s.shape.cy - oy) * factorY;
          s.shape.rx *= factorX; s.shape.ry *= factorY;
        }
        if ('x' in s.shape) {
          s.shape.x = ox + (s.shape.x - ox) * factorX; s.shape.y = oy + (s.shape.y - oy) * factorY;
          s.shape.w *= factorX; s.shape.h *= factorY;
        }
      }
    });
    (page.elements || []).filter(el => currentSelection.elemIds.includes(el.id)).forEach(el => {
      el.x = ox + (el.x - ox) * factorX; el.y = oy + (el.y - oy) * factorY;
      el.w = Math.max(24, el.w * factorX); el.h = Math.max(24, el.h * factorY);
    });
    (page.texts || []).filter(t => currentSelection.textIds.includes(t.id)).forEach(t => {
      t.x = ox + (t.x - ox) * factorX; t.y = oy + (t.y - oy) * factorY;
      t.w = Math.max(80, (t.w || 220) * factorX);
    });
    currentSelection.rect.w = Math.max(30, currentSelection.rect.w * factorX);
    currentSelection.rect.h = Math.max(30, currentSelection.rect.h * factorY);
  }

  window.lassoAction = function (act) {
    const page = getActivePage();
    if (!page || !currentSelection) return;
    pushPageHistory(page);

    if (act === 'delete') {
      page.strokes = page.strokes.filter(s => !currentSelection.strokeIds.includes(s.id));
      page.texts = page.texts.filter(t => !currentSelection.textIds.includes(t.id));
      page.elements = page.elements.filter(el => !currentSelection.elemIds.includes(el.id));
      currentSelection = null;
    } else if (act === 'rotate') {
      const r = currentSelection.rect;
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      const ang = (15 * Math.PI) / 180;
      const cosA = Math.cos(ang), sinA = Math.sin(ang);
      page.strokes.filter(s => currentSelection.strokeIds.includes(s.id)).forEach(s => {
        s.points.forEach(p => {
          const dx = p.x - cx, dy = p.y - cy;
          p.x = cx + dx * cosA - dy * sinA;
          p.y = cy + dx * sinA + dy * cosA;
        });
      });
      (page.elements || []).filter(el => currentSelection.elemIds.includes(el.id)).forEach(el => {
        el.rotation = ((el.rotation || 0) + 15) % 360;
      });
      currentSelection.rect = computeSelectionBounds(page, currentSelection.strokeIds, currentSelection.textIds, currentSelection.elemIds);
    } else if (act === 'duplicate') {
      const newS = [], newT = [], newE = [];
      page.strokes.filter(s => currentSelection.strokeIds.includes(s.id)).forEach(s => {
        const c = JSON.parse(JSON.stringify(s)); c.id = uid('st');
        c.points.forEach(p => { p.x += 24; p.y += 24; });
        page.strokes.push(c); newS.push(c.id);
      });
      (page.texts || []).filter(t => currentSelection.textIds.includes(t.id)).forEach(t => {
        const c = JSON.parse(JSON.stringify(t)); c.id = uid('tx'); c.x += 24; c.y += 24;
        page.texts.push(c); newT.push(c.id);
      });
      (page.elements || []).filter(el => currentSelection.elemIds.includes(el.id)).forEach(el => {
        const c = JSON.parse(JSON.stringify(el)); c.id = uid('el'); c.x += 24; c.y += 24;
        page.elements.push(c); newE.push(c.id);
      });
      currentSelection = { rect: Object.assign({}, currentSelection.rect, { x: currentSelection.rect.x + 24, y: currentSelection.rect.y + 24 }), strokeIds: newS, textIds: newT, elemIds: newE };
      showToast('Duplicated selection');
    } else if (act === 'recolor') {
      const nextColor = prompt('Enter HEX color (e.g., #dc2626, #059669, #1d4ed8):', settings.penColor);
      if (nextColor) {
        page.strokes.filter(s => currentSelection.strokeIds.includes(s.id)).forEach(s => s.color = nextColor);
      }
    } else if (act === 'element') {
      const imgUrl = captureRectToDataUrl(page, currentSelection.rect);
      state.customElements.unshift({
        id: uid('cel'),
        category: 'My Elements',
        name: 'Saved Clip ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        w: Math.round(currentSelection.rect.w),
        h: Math.round(currentSelection.rect.h),
        src: imgUrl
      });
      showToast('Saved to Elements Library ⭐');
    } else if (act === 'screenshot') {
      const imgUrl = captureRectToDataUrl(page, currentSelection.rect);
      shareOrDownloadFile('GoodNotes_Selection.png', imgUrl, 'image/png', true);
      showToast('Selection screenshot ready');
    } else if (act === 'convert') {
      toggleAIDrawer(true);
      runAIPreset('ocr', currentSelection.rect);
    }

    renderDryCurrent();
    renderDomOverlay(page);
    scheduleSaveLibrary();
  };

  function captureRectToDataUrl(page, rect) {
    const tmp = document.createElement('canvas');
    tmp.width = Math.max(10, Math.round(rect.w * 2));
    tmp.height = Math.max(10, Math.round(rect.h * 2));
    const c = tmp.getContext('2d');
    c.scale(2, 2);
    c.translate(-rect.x, -rect.y);
    c.drawImage($('dryCanvas'), 0, 0, $('dryCanvas').width / (window.devicePixelRatio > 1 ? Math.min(window.devicePixelRatio, 2) : 1), $('dryCanvas').height / (window.devicePixelRatio > 1 ? Math.min(window.devicePixelRatio, 2) : 1));
    return tmp.toDataURL('image/png');
  }

  // -------------------- TEXT BOXES & DOM OVERLAY --------------------
  function createTextBoxAt(x, y) {
    const page = getActivePage();
    if (!page) return;
    pushPageHistory(page);
    const tb = {
      id: uid('tx'),
      x, y, w: 260,
      text: 'Type here...',
      fontSize: settings.textFontSize,
      fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
      color: settings.textColor,
      bg: settings.textBg,
      bold: settings.textBold,
      align: 'left'
    };
    page.texts.push(tb);
    selectedTextId = tb.id;
    renderDomOverlay(page);
    scheduleSaveLibrary();
    setTimeout(() => {
      const ed = document.querySelector(`[data-tid="${tb.id}"] .gn-textbox-editor`);
      if (ed) { ed.focus(); document.execCommand('selectAll', false, null); }
    }, 20);
  }

  function renderDomOverlay(page) {
    const dom = $('domOverlay');
    dom.innerHTML = '';

    (page.texts || []).forEach(t => {
      const box = document.createElement('div');
      box.className = 'gn-textbox' + (selectedTextId === t.id ? ' selected' : '');
      box.dataset.tid = t.id;
      box.style.left = t.x + 'px';
      box.style.top = t.y + 'px';
      box.style.width = (t.w || 260) + 'px';
      box.style.fontSize = (t.fontSize || 19) + 'px';
      box.style.fontFamily = t.fontFamily || 'inherit';
      box.style.color = t.color || '#0f172a';
      box.style.background = t.bg || 'transparent';
      box.style.fontWeight = t.bold ? '700' : '400';
      box.style.textAlign = t.align || 'left';

      const ed = document.createElement('div');
      ed.className = 'gn-textbox-editor';
      ed.contentEditable = !readOnlyMode;
      ed.textContent = t.text;
      ed.oninput = () => { t.text = ed.textContent; scheduleSaveLibrary(); };
      ed.onfocus = () => { selectedTextId = t.id; box.classList.add('selected'); };

      // Drag text box when dragging border
      let dragStart = null;
      box.addEventListener('pointerdown', (ev) => {
        if (ev.target === ed && document.activeElement === ed) return;
        if (readOnlyMode) return;
        selectedTextId = t.id;
        dragStart = { px: ev.clientX, py: ev.clientY, ox: t.x, oy: t.y };
        box.setPointerCapture(ev.pointerId);
      });
      box.addEventListener('pointermove', (ev) => {
        if (!dragStart) return;
        t.x = dragStart.ox + (ev.clientX - dragStart.px) / viewScale;
        t.y = dragStart.oy + (ev.clientY - dragStart.py) / viewScale;
        box.style.left = t.x + 'px';
        box.style.top = t.y + 'px';
      });
      box.addEventListener('pointerup', () => { if (dragStart) { dragStart = null; scheduleSaveLibrary(); } });

      if (selectedTextId === t.id && !readOnlyMode) {
        const del = document.createElement('button');
        del.textContent = '🗑️';
        del.style.cssText = 'position:absolute; top:-26px; right:0; background:#0f172a; color:#fff; border-radius:6px; padding:2px 6px; font-size:11px;';
        del.onclick = (e) => {
          e.stopPropagation();
          page.texts = page.texts.filter(x => x.id !== t.id);
          selectedTextId = null;
          renderDomOverlay(page);
          scheduleSaveLibrary();
        };
        box.appendChild(del);
      }

      box.appendChild(ed);
      dom.appendChild(box);
    });

    if (currentSelection) {
      const r = currentSelection.rect;
      const lbox = document.createElement('div');
      lbox.className = 'lasso-box';
      lbox.style.left = r.x + 'px';
      lbox.style.top = r.y + 'px';
      lbox.style.width = r.w + 'px';
      lbox.style.height = r.h + 'px';

      lbox.innerHTML = `
        <div class="lasso-menu" onpointerdown="event.stopPropagation()">
          <button onclick="lassoAction('recolor')">🎨 Color</button>
          <button onclick="lassoAction('rotate')">↻ 15°</button>
          <button onclick="lassoAction('convert')">🔤 Convert</button>
          <button onclick="lassoAction('element')">⭐ Element</button>
          <button onclick="lassoAction('screenshot')">📸 Shot</button>
          <button onclick="lassoAction('duplicate')">➕ Copy</button>
          <button onclick="lassoAction('delete')">🗑️</button>
        </div>
        <div class="lasso-handle"></div>`;

      let dragMode = null;
      lbox.addEventListener('pointerdown', (ev) => {
        if (ev.target.closest('.lasso-menu')) return;
        ev.stopPropagation();
        lbox.setPointerCapture(ev.pointerId);
        const isResize = ev.target.classList.contains('lasso-handle');
        dragMode = { type: isResize ? 'resize' : 'move', sx: ev.clientX, sy: ev.clientY, lastX: ev.clientX, lastY: ev.clientY, w: r.w, h: r.h };
      });
      lbox.addEventListener('pointermove', (ev) => {
        if (!dragMode) return;
        const dx = (ev.clientX - dragMode.lastX) / viewScale;
        const dy = (ev.clientY - dragMode.lastY) / viewScale;
        dragMode.lastX = ev.clientX;
        dragMode.lastY = ev.clientY;
        if (dragMode.type === 'move') {
          moveSelectionBy(page, dx, dy);
        } else {
          const fw = Math.max(0.4, (r.w + dx) / Math.max(20, r.w));
          const fh = Math.max(0.4, (r.h + dy) / Math.max(20, r.h));
          scaleSelection(page, fw, fh);
        }
        lbox.style.left = r.x + 'px';
        lbox.style.top = r.y + 'px';
        lbox.style.width = r.w + 'px';
        lbox.style.height = r.h + 'px';
        renderDryCurrent();
      });
      lbox.addEventListener('pointerup', () => {
        if (dragMode) { dragMode = null; renderDomOverlay(page); scheduleSaveLibrary(); }
      });

      dom.appendChild(lbox);
    }
  }

    const file = e.target.files[0];

          w: Math.round(img.width * scale),
          h: Math.round(img.height * scale),
          rotation: 0,
          src: reader.result,
          name: file.name
        });
        renderDryCurrent();
        scheduleSaveLibrary();
        showToast('Image inserted (Use Lasso to move/resize)');

      img.src = reader.result;
    };

  // -------------------- LASER POINTER --------------------
  function startLaserLoop() {
    if (laserRaf) return;
    const step = () => {
      const nb = getActiveNotebook(), page = getActivePage();
      if (!nb || !page) { laserRaf = 0; return; }
      const now = performance.now();
      laserTrail = laserTrail.filter(p => now - p.t < (settings.laserType === 'dot' ? 200 : 1400));
      const { w, h } = getPageDimensions(nb, page);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      wetCtx.save();
      wetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      wetCtx.clearRect(0, 0, w, h);

      if (laserTrail.length > 0) {
        if (settings.laserType === 'dot') {
          const last = laserTrail[laserTrail.length - 1];
          wetCtx.shadowColor = settings.laserColor;
          wetCtx.shadowBlur = 16;
          wetCtx.fillStyle = settings.laserColor;
          wetCtx.beginPath();
          wetCtx.arc(last.x, last.y, 8, 0, Math.PI * 2);
          wetCtx.fill();
        } else {
          for (let i = 1; i < laserTrail.length; i++) {
            const p0 = laserTrail[i - 1], p1 = laserTrail[i];
            const age = (now - p1.t) / 1400;
            wetCtx.globalAlpha = Math.max(0, 1 - age);
            wetCtx.strokeStyle = settings.laserColor;
            wetCtx.lineWidth = Math.max(2, 8 * (1 - age));
            wetCtx.lineCap = 'round';
            wetCtx.beginPath();
            wetCtx.moveTo(p0.x, p0.y);
            wetCtx.lineTo(p1.x, p1.y);
            wetCtx.stroke();
          }
        }
      }
      wetCtx.restore();
      if (laserTrail.length > 0) laserRaf = requestAnimationFrame(step);
      else laserRaf = 0;
    };
    laserRaf = requestAnimationFrame(step);
  }

  // -------------------- RULER STRAIGHTEDGE TOOL --------------------
  window.toggleRuler = function () {
    rulerOn = !rulerOn;
    $('rulerOverlay').classList.toggle('hidden', !rulerOn);
    document.querySelector('[data-tool="ruler"]').classList.toggle('active', rulerOn);
    updateRulerTransform();
  };

  window.rotateRulerBy = function (deg) { rulerState.angle = (rulerState.angle + deg + 360) % 360; updateRulerTransform(); };
  window.setRulerAngle = function (deg) { rulerState.angle = deg; updateRulerTransform(); };

  function updateRulerTransform() {
    const r = $('rulerOverlay');
    r.style.left = rulerState.x + 'px';
    r.style.top = rulerState.y + 'px';
    r.style.transform = `rotate(${rulerState.angle}deg)`;
    $('rulerAngleLabel').textContent = Math.round(rulerState.angle) + '°';
  }

  function initRulerInteractions() {
    const r = $('rulerOverlay');
    let drag = null;
    r.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      e.stopPropagation();
      r.setPointerCapture(e.pointerId);
      drag = { sx: e.clientX, sy: e.clientY, ox: rulerState.x, oy: rulerState.y };
    });
    r.addEventListener('pointermove', (e) => {
      if (!drag) return;
      rulerState.x = drag.ox + (e.clientX - drag.sx);
      rulerState.y = drag.oy + (e.clientY - drag.sy);
      updateRulerTransform();
    });
    r.addEventListener('pointerup', () => drag = null);
  }

  function snapPointToRulerIfNear(pt) {
    if (!rulerOn) return pt;
    const rRect = $('rulerOverlay').getBoundingClientRect();
    const sRect = $('pageSheet').getBoundingClientRect();
    const nb = getActiveNotebook(), page = getActivePage();
    if (!nb || !page) return pt;
    const { w, h } = getPageDimensions(nb, page);
    // Ruler center in page coordinates
    const rcx = ((rRect.left + rRect.width / 2 - sRect.left) / sRect.width) * w;
    const rcy = ((rRect.top + rRect.height / 2 - sRect.top) / sRect.height) * h;
    const rad = (rulerState.angle * Math.PI) / 180;
    const ux = Math.cos(rad), uy = Math.sin(rad); // along ruler
    const nx = -uy, ny = ux; // normal to ruler
    const halfThick = (76 / 2) / viewScale;
    const vx = pt.x - rcx, vy = pt.y - rcy;
    const projAlong = vx * ux + vy * uy;
    const projNormal = vx * nx + vy * ny;
    if (Math.abs(projAlong) <= (560 / 2) / viewScale + 20) {
      const distTop = Math.abs(projNormal + halfThick);
      const distBot = Math.abs(projNormal - halfThick);
      if (distTop < 26) {
        return { x: rcx + projAlong * ux - halfThick * nx, y: rcy + projAlong * uy - halfThick * ny };
      }
      if (distBot < 26) {
        return { x: rcx + projAlong * ux + halfThick * nx, y: rcy + projAlong * uy + halfThick * ny };
      }
    }
    return pt;
  }

  // -------------------- ZOOM WINDOW (MAGNIFIED PRECISION WRITING) --------------------
  let zoomBox = { x: 70, y: 150, w: 400, h: 112 };
  let zoomStroke = null;

  window.toggleZoomWindow = function () {
    zoomWindowOn = !zoomWindowOn;
    $('zoomDock').classList.toggle('hidden', !zoomWindowOn);
    $('zoomTargetBox').classList.toggle('hidden', !zoomWindowOn);
    document.querySelector('[data-tool="zoom"]').classList.toggle('active', zoomWindowOn);
    if (zoomWindowOn) {
      positionZoomTargetBox();
      setTimeout(syncZoomWindowCanvas, 30);
    }
  };

  function positionZoomTargetBox() {
    const zb = $('zoomTargetBox');
    zb.style.left = zoomBox.x + 'px';
    zb.style.top = zoomBox.y + 'px';
    zb.style.width = zoomBox.w + 'px';
    zb.style.height = zoomBox.h + 'px';
  }

  window.nudgeZoomBox = function (dx, dy) {
    const nb = getActiveNotebook(), page = getActivePage();
    if (!nb || !page) return;
    const { w, h } = getPageDimensions(nb, page);
    zoomBox.x = Math.max(10, Math.min(w - zoomBox.w - 10, zoomBox.x + dx));
    zoomBox.y = Math.max(10, Math.min(h - zoomBox.h - 10, zoomBox.y + dy));
    positionZoomTargetBox();
    syncZoomWindowCanvas();
  };

  window.zoomNewLine = function () {
    zoomBox.x = 64;
    nudgeZoomBox(0, zoomBox.h * 0.72);
  };

  function syncZoomWindowCanvas() {
    const pad = $('zoomPadWrap');
    const rect = pad.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ['zoomDryCanvas', 'zoomWetCanvas'].forEach(cid => {
      const c = $(cid);
      c.width = rect.width * dpr;
      c.height = rect.height * dpr;
    });
    const ctx = zoomDryCtx;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, rect.width, rect.height);
    const scaleDpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.drawImage($('bgCanvas'), zoomBox.x * scaleDpr, zoomBox.y * scaleDpr, zoomBox.w * scaleDpr, zoomBox.h * scaleDpr, 0, 0, rect.width, rect.height);
    ctx.drawImage($('dryCanvas'), zoomBox.x * scaleDpr, zoomBox.y * scaleDpr, zoomBox.w * scaleDpr, zoomBox.h * scaleDpr, 0, 0, rect.width, rect.height);
    ctx.restore();
  }

  function initZoomWindowInteractions() {
    // Drag target box on page
    const zb = $('zoomTargetBox');
    let zDrag = null;
    zb.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      zb.setPointerCapture(e.pointerId);
      zDrag = { sx: e.clientX, sy: e.clientY, ox: zoomBox.x, oy: zoomBox.y };
    });
    zb.addEventListener('pointermove', (e) => {
      if (!zDrag) return;
      zoomBox.x = Math.max(0, zDrag.ox + (e.clientX - zDrag.sx) / viewScale);
      zoomBox.y = Math.max(0, zDrag.oy + (e.clientY - zDrag.sy) / viewScale);
      positionZoomTargetBox();
      syncZoomWindowCanvas();
    });
    zb.addEventListener('pointerup', () => zDrag = null);

    // Zero-delay drawing inside Zoom Pad
    const zw = $('zoomWetCanvas');
    function mapZoomPt(e) {
      const r = zw.getBoundingClientRect();
      const lx = e.clientX - r.left, ly = e.clientY - r.top;
      return {
        lx, ly, rw: r.width, rh: r.height,
        px: zoomBox.x + (lx / r.width) * zoomBox.w,
        py: zoomBox.y + (ly / r.height) * zoomBox.h,
        p: e.pressure > 0 ? e.pressure : 0.5
      };
    }

    zw.addEventListener('pointerdown', (e) => {
      if (settings.pencilOnly && e.pointerType === 'touch') return;
      zw.setPointerCapture(e.pointerId);
      const mp = mapZoomPt(e);
      zoomStroke = {
        id: uid('st'),
        tool: activeTool === 'highlighter' ? 'highlighter' : 'pen',
        penType: settings.penType,
        color: activeTool === 'highlighter' ? settings.hlColor : settings.penColor,
        width: activeTool === 'highlighter' ? settings.hlSize : settings.penSize,
        opacity: activeTool === 'highlighter' ? 0.38 : 1,
        points: [{ x: mp.px, y: mp.py, p: mp.p }],
        localPts: [{ x: mp.lx, y: mp.ly, p: mp.p }]
      };
    });

    const onZoomMove = (e) => {
      if (!zoomStroke) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of evs) {
        const mp = mapZoomPt(ev);
        zoomStroke.points.push({ x: mp.px, y: mp.py, p: mp.p });
        zoomStroke.localPts.push({ x: mp.lx, y: mp.ly, p: mp.p });
      }
      const r = zw.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      zoomWetCtx.save();
      zoomWetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      zoomWetCtx.clearRect(0, 0, r.width, r.height);
      const scaleFactor = r.width / zoomBox.w;
      drawStroke(zoomWetCtx, {
        tool: zoomStroke.tool,
        penType: zoomStroke.penType,
        color: zoomStroke.color,
        width: zoomStroke.width * scaleFactor,
        opacity: zoomStroke.opacity,
        points: zoomStroke.localPts
      });
      zoomWetCtx.restore();
    };

    if ('onpointerrawupdate' in window) zw.addEventListener('pointerrawupdate', onZoomMove);
    else zw.addEventListener('pointermove', onZoomMove);

    zw.addEventListener('pointerup', () => {
      if (!zoomStroke) return;
      const page = getActivePage();
      const lastLocal = zoomStroke.localPts[zoomStroke.localPts.length - 1];
      const padWidth = zw.getBoundingClientRect().width;
      delete zoomStroke.localPts;
      if (page) {
        pushPageHistory(page);
        page.strokes.push(zoomStroke);
        renderDryCurrent();
        scheduleSaveLibrary();
      }
      zoomStroke = null;
      zoomWetCtx.clearRect(0, 0, zw.width, zw.height);

      // Auto-advance if stroke entered the right 18% blue margin
      if (lastLocal && lastLocal.x > padWidth * 0.82) {
        nudgeZoomBox(zoomBox.w * 0.65, 0);
      } else {
        syncZoomWindowCanvas();
      }
    });
  }

    if (!pageHistory.has(page.id)) pageHistory.set(page.id, { undo: [], redo: [] });

    h.undo.push(JSON.stringify({ strokes: page.strokes, texts: page.texts, elements: page.elements, tapes: page.tapes }));
    if (h.undo.length > 40) h.undo.shift();
    h.redo = [];
    updateUndoRedoButtons(page);
  }

  function updateUndoRedoButtons(page) {
    const h = pageHistory.get(page?.id) || { undo: [], redo: [] };

    $('btnRedo').disabled = h.redo.length === 0;
  }

        : `<button class="btn-primary" style="width:100%; justify-content:center;" onclick="closePopover(); startAudioRecording()">● Start Recording</button>`}

      </div>` : ''}

  window.startAudioRecording = async function () {
    const nb = getActiveNotebook();
    if (!nb) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      const clipId = uid('aud');
      activeRecordingClipId = clipId;
      recStartTime = performance.now();

      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => {
          nb.audioClips = nb.audioClips || [];
          nb.audioClips.push({
            id: clipId,
            title: 'Clip ' + (nb.audioClips.length + 1),
            pageIndex: activePageIndex,
            durationSec: (performance.now() - recStartTime) / 1000,
            dataUrl: reader.result,
            createdAt: Date.now()
          });
          scheduleSaveLibrary();
          showToast('Audio saved & synced with strokes 🎙️');
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      $('btnAudioRec').classList.add('recording');
      $('recStatusPill').classList.remove('hidden');
      recClockInterval = setInterval(() => {
        const s = Math.floor((performance.now() - recStartTime) / 1000);
        $('recClock').textContent = fmtSec(s);
      }, 400);
    } catch (err) {
      activeRecordingClipId = null;
      showToast('Microphone unavailable or denied: ' + (err.message || 'Check permissions'));
    }
  };

  window.stopAudioRecording = function () {
    clearInterval(recClockInterval);
    $('btnAudioRec').classList.remove('recording');
    $('recStatusPill').classList.add('hidden');
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    activeRecordingClipId = null;
  };

  window.playAudioClip = function (clipId) {
    const nb = getActiveNotebook();
    const clip = nb?.audioClips?.find(c => c.id === clipId);
    if (!clip) return;
    if (clip.pageIndex !== activePageIndex) {
      activePageIndex = clip.pageIndex;
      renderActivePage(true);
    }
    if (audioEl) { audioEl.pause(); audioEl = null; }
    activePlaybackClip = clip;
    audioEl = new Audio(clip.dataUrl);
    $('playAudioPill').classList.remove('hidden');
    audioEl.play().catch(() => {});

    const tick = () => {
      if (!audioEl || !activePlaybackClip) return;
      $('audioPlayTime').textContent = fmtSec(audioEl.currentTime) + ' / ' + fmtSec(clip.durationSec);
      $('audioPlayPauseBtn').textContent = audioEl.paused ? '▶ Play' : '⏸ Pause';
      renderDryCurrent();
      if (!audioEl.paused) audioSyncRaf = requestAnimationFrame(tick);
    };
    audioEl.onplay = () => tick();
    audioEl.onended = () => { $('audioPlayPauseBtn').textContent = '▶ Replay'; renderDryCurrent(); };
    tick();
  };

    const labels = {

    // If user configured Gemini API key, call Gemini Vision with page snapshot!
    if (settings.geminiKey) {
      try {
        const snapshot = clipRect ? captureRectToDataUrl(page, clipRect) : renderFullPageDataUrl(nb, page, 'image/jpeg', 0.85);
        const b64 = snapshot.split(',')[1];
        const sys = mode === 'flashcards'
          ? 'Extract 3-5 study flashcards formatted strictly as Question | Answer lines from this note page.'
          : 'You are Goodnotes Math & Study AI. Inspect the attached handwritten/typed note image carefully and answer clearly.';
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(settings.geminiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: sys + '\nUser request: ' + (labels[mode] || customPrompt) }, { inlineData: { mimeType: 'image/jpeg', data: b64 } }] }]
          })
        });
        const data = await resp.json();
        const ans = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('\n');
        if (ans) {
          appendAIMsg('assistant', ans);
          if (mode === 'flashcards') createFlashcardsFromLines(nb.title + ' Deck', ans);
          return;
        }
      } catch (err) {
        appendAIMsg('assistant', '⚠️ Gemini request failed (' + err.message + '). Falling back to local assistant...');
      }
    }

    // Built-in Offline Assistant
    const pageText = (page.texts || []).map(t => t.text).join('\n').trim();
    const strokeCount = (page.strokes || []).length;
    if (mode === 'summarize') {
      appendAIMsg('assistant', pageText
        ? `Summary of "${nb.title}" (Page ${activePageIndex + 1}):\n• ${pageText.split('\n').slice(0, 5).join('\n• ')}\n• Also contains ${strokeCount} ink stroke(s).`
        : `Page ${activePageIndex + 1} currently has ${strokeCount} handwritten strokes and ${(page.elements || []).length} visual elements. Add a Gemini API key in ⚙️ Settings to transcribe handwritten equations visually!`);
    } else if (mode === 'check_math') {
      const exprMatch = pageText.match(/([0-9+\-*/().^\s]+)=?/);
      if (exprMatch) {
        appendAIMsg('assistant', `Detected expression in text: "${exprMatch[0]}". Ensure sign consistency across brackets and double-check boundary conditions. (Add a Gemini API key in ⚙️ Settings for full handwritten step-by-step Vision grading!)`);
      } else {
        appendAIMsg('assistant', `Inspecting ${strokeCount} handwritten strokes on Page ${activePageIndex + 1}. Tip: Add your free Google AI Studio Gemini key in ⚙️ Settings to unlock real-time Vision Math Assist for handwritten calculus & algebra!`);
      }
    } else if (mode === 'ocr') {
      appendAIMsg('assistant', pageText
        ? `Extracted Page Text:\n${pageText}`
        : `Captured ${strokeCount} strokes in selection. Connect a Gemini API key in ⚙️ Settings for instant handwriting-to-LaTeX / text OCR.`);
    } else if (mode === 'flashcards') {
      const lines = pageText.split('\n').filter(l => l.includes(':') || l.includes('='));
      if (lines.length) {
        const formatted = lines.map(l => l.replace(/[:=]/, ' | ')).join('\n');
        createFlashcardsFromLines(nb.title + ' Study Cards', formatted);
        appendAIMsg('assistant', `Created a Study Set from ${lines.length} key points on this page! Open 🧠 Study Sets in the Library to practice.`);
      } else {
        appendAIMsg('assistant', 'Tip: Write definitions with ":" or "=" (e.g. "Euler Formula : e^(iθ) = cos θ + i sin θ") or connect Gemini AI in ⚙️ Settings to generate Study Sets automatically.');
      }
    } else {
      appendAIMsg('assistant', `On Page ${activePageIndex + 1} of "${nb.title}": ${strokeCount} strokes, ${(page.texts || []).length} text boxes, ${(page.tapes || []).length} study tapes. Add a Gemini key in ⚙️ Settings to ask visual questions about your handwriting!`);
    }
  };

  // -------------------- PURE-JS PDF WRITER + IMPORT PDF/IMAGE --------------------
  function renderFullPageDataUrl(nb, page, mime = 'image/jpeg', qual = 0.86) {
    const { w, h } = getPageDimensions(nb, page);
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const ctx = off.getContext('2d');
    renderBackgroundLayer(ctx, w, h, 1, nb, page);
    // Draw background synchronously when PDF image is cached
    if (page.pdfBg && imgCache.has(page.pdfBg)) {
      const im = imgCache.get(page.pdfBg);
      if (im.complete) ctx.drawImage(im, 0, 0, w, h);
    }
    renderDryLayerSync(ctx, w, h, page);
    // Draw Text boxes onto export canvas
    (page.texts || []).forEach(t => {
      ctx.save();
      ctx.fillStyle = t.color || '#0f172a';
      ctx.font = `${t.bold ? '700' : '400'} ${t.fontSize || 19}px -apple-system, sans-serif`;
      const lines = (t.text || '').split('\n');
      lines.forEach((ln, li) => ctx.fillText(ln, t.x + 8, t.y + 24 + li * ((t.fontSize || 19) * 1.38)));
      ctx.restore();
    });
    return off.toDataURL(mime, qual);
  }

  function renderDryLayerSync(ctx, w, h, page) {
    (page.strokes || []).filter(s => s.tool === 'highlighter').forEach(s => drawStroke(ctx, s));
    (page.elements || []).forEach(el => {
      const im = imgCache.get(el.src);
      if (im && im.complete) drawElementObj(ctx, el, im);
    });
    (page.strokes || []).filter(s => s.tool !== 'highlighter').forEach(s => drawStroke(ctx, s));
    (page.tapes || []).forEach(tp => drawTapeStrip(ctx, tp));
  }

  function buildMultiPagePdfBytes(nb) {
    const encoder = new TextEncoder();
    const parts = [];
    const offsets = [0];
    let byteLen = 0;

    function pushStr(str) {
      const b = encoder.encode(str);
      parts.push(b);
      byteLen += b.length;
    }
    function pushBytes(u8) {
      parts.push(u8);
      byteLen += u8.length;
    }
    function startObj(id) {
      offsets[id] = byteLen;
      pushStr(`${id} 0 obj\n`);
    }

    pushStr('%PDF-1.4\n');
    const pageIds = [];
    const total = nb.pages.length;
    // Object IDs: 1 = Catalog, 2 = Pages, then 3 objects per page (Page, Contents, Image)
    for (let i = 0; i < total; i++) pageIds.push(3 + i * 3);

    startObj(1);
    pushStr('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

    startObj(2);
    pushStr(`<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(' ')}] /Count ${total} >>\nendobj\n`);

    for (let i = 0; i < total; i++) {
      const page = nb.pages[i];
      const { w, h } = getPageDimensions(nb, page);
      const dataUrl = renderFullPageDataUrl(nb, page, 'image/jpeg', 0.85);
      const binStr = atob(dataUrl.split(',')[1]);
      const jpgBytes = new Uint8Array(binStr.length);
      for (let k = 0; k < binStr.length; k++) jpgBytes[k] = binStr.charCodeAt(k);

      const pId = 3 + i * 3;
      const cId = pId + 1;
      const imId = pId + 2;
      const ptW = Math.round(w * 0.62);
      const ptH = Math.round(h * 0.62);
      const streamStr = `q ${ptW} 0 0 ${ptH} 0 0 cm /Im0 Do Q\n`;

      startObj(pId);
      pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}] /Resources << /XObject << /Im0 ${imId} 0 R >> >> /Contents ${cId} 0 R >>\nendobj\n`);

      startObj(cId);
      pushStr(`<< /Length ${streamStr.length} >>\nstream\n${streamStr}endstream\nendobj\n`);

      startObj(imId);
      pushStr(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgBytes.length} >>\nstream\n`);
      pushBytes(jpgBytes);
      pushStr('\nendstream\nendobj\n');
    }

    const xrefStart = byteLen;
    const maxId = 2 + total * 3;
    pushStr(`xref\n0 ${maxId + 1}\n0000000000 65535 f \n`);
    for (let id = 1; id <= maxId; id++) {
      pushStr(String(offsets[id]).padStart(10, '0') + ' 00000 n \n');
    }
    pushStr(`trailer\n<< /Size ${maxId + 1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF\n`);

    const totalOut = new Uint8Array(byteLen);
    let pos = 0;
    for (const chunk of parts) { totalOut.set(chunk, pos); pos += chunk.length; }
    return totalOut;
  }

  function u8ToBase64(u8) {
    let bin = '';
    const chunk = 0x8000;
    for (let i = 0; i < u8.length; i += chunk) {
      bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  function ensureSrcLoaded(src) {
    return new Promise((resolve) => {
      if (!src) return resolve();
      if (imgCache.has(src) && imgCache.get(src).complete) return resolve();
      const img = imgCache.get(src) || new Image();
      img.onload = () => resolve();
      img.onerror = () => resolve();
      if (!img.src) img.src = src;
      imgCache.set(src, img);
    });
  }

  async function ensureNotebookImagesLoaded(nb) {
    const tasks = [];
    nb.pages.forEach(p => {
      if (p.pdfBg) tasks.push(ensureSrcLoaded(p.pdfBg));
      (p.elements || []).forEach(el => tasks.push(ensureSrcLoaded(el.src)));
    });
    await Promise.all(tasks);
  }

  function shareOrDownloadFile(filename, dataOrB64, mimeType, isDataUrl = false, isRawBase64 = false) {

  function shareOrDownloadText(filename, text, mimeType = 'application/json') {

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
