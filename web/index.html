  // -------------------- IMPORT PDF / IMAGE / BACKUP --------------------
  window.triggerGlobalFileImport = function () { $('fileImportInput').click(); };

  const nativePdfResolvers = new Map();
  window.__onNativePdfResult = function (reqId, payload) {
    const res = nativePdfResolvers.get(reqId);
    if (res) { nativePdfResolvers.delete(reqId); res(payload); }
  };

  window.handleGlobalFileImport = async function (e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    if (file.name.endsWith('.json')) {
      const txt = await file.text();
      restoreFromBackupJsonString(txt);
      return;
    }

    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = () => {
        const nb = {
          id: uid('nb'),
          title: file.name.replace(/\.[^.]+$/, ''),
          folderId: currentFolderId,
          coverId: 'minimal',
          paperColorId: 'white',
          sizeId: 'goodnotes',
          orientation: 'portrait',
          starred: false,
          trashed: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          outlines: [],
          audioClips: [],
          pages: [Object.assign(createEmptyPage('blank', 'white'), { pdfBg: reader.result })]
        };
        state.notebooks.unshift(nb);
        scheduleSaveLibrary();
        openNotebook(nb.id, 0);
        showToast('Imported image as notebook 🖼️');
      };
      reader.readAsDataURL(file);
      return;
    }

    if (file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf') {
      showToast('Importing PDF pages...');
      const buf = await file.arrayBuffer();
      const b64 = u8ToBase64(new Uint8Array(buf));

      // 1. Try Native iOS PDFKit Renderer first (100% offline, instant!)
      if (window.webkit?.messageHandlers?.nativeRenderPdf) {
        const reqId = uid('pdf');
        const result = await new Promise((resolve) => {
          nativePdfResolvers.set(reqId, resolve);
          sendNative('nativeRenderPdf', { requestId: reqId, base64: b64, maxPages: 60 });
          setTimeout(() => resolve({ error: 'PDF render timed out' }), 35000);
        });
        if (result && result.pages && result.pages.length) {
          createNotebookFromPdfPages(file.name, result.pages);
          return;
        }
      }

      // 2. Browser Fallback: Lazy-load pdf.js from CDN
      try {
        await ensurePdfJsLoaded();
        const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf), disableWorker: true }).promise;
        const maxP = Math.min(pdf.numPages, 50);
        const rendered = [];
        for (let i = 1; i <= maxP; i++) {
          const p = await pdf.getPage(i);
          const vp = p.getViewport({ scale: 1.6 });
          const c = document.createElement('canvas');
          c.width = vp.width; c.height = vp.height;
          await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          rendered.push({ width: Math.round(vp.width), height: Math.round(vp.height), dataUrl: c.toDataURL('image/jpeg', 0.84) });
        }
        createNotebookFromPdfPages(file.name, rendered);
      } catch (err) {
        showToast('Could not parse PDF offline in browser; use the iOS .ipa for offline PDFKit import.');
      }
    }
  };

  function createNotebookFromPdfPages(filename, pagesData) {
    const pages = pagesData.map(pd => Object.assign(createEmptyPage('blank', 'white'), {
      pdfBg: pd.dataUrl,
      pdfWidth: pd.width,
      pdfHeight: pd.height
    }));
    const nb = {
      id: uid('nb'),
      title: filename.replace(/\.pdf$/i, ''),
      folderId: currentFolderId,
      coverId: 'cobalt',
      paperColorId: 'white',
      sizeId: 'goodnotes',
      orientation: 'portrait',
      starred: false,
      trashed: false,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      outlines: [],
      audioClips: [],
      pages
    };
    state.notebooks.unshift(nb);
    scheduleSaveLibrary();
    openNotebook(nb.id, 0);
    showToast(`Imported ${pages.length} PDF pages!`);
  }

  function ensurePdfJsLoaded() {
    if (window.pdfjsLib) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = () => {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          resolve();
        } else reject(new Error('pdfjs failed'));
      };
      s.onerror = () => reject(new Error('Network unavailable'));
      document.head.appendChild(s);
    });
  }

  function restoreFromBackupJsonString(txt) {
    try {
      const parsed = JSON.parse(txt);
      const payload = parsed.data && parsed.data.notebooks ? parsed.data : parsed;
      if (!payload || !Array.isArray(payload.notebooks)) throw new Error('Invalid backup format');
      state = payload;
      persistLibraryNow();
      renderLibrary();
      showToast(`Restored ${state.notebooks.length} notebooks from backup!`);
    } catch (err) {
      alert('Failed to restore backup: ' + err.message);
    }
  }

  // -------------------- GOOGLE DRIVE BACKUP & RESTORE CENTER --------------------

    } else if (connected) {
      $('libCloudStatus').textContent = 'Google Drive Connected';
    } else {
      $('libCloudStatus').textContent = 'Tap to connect backup';
    }
  }

  window.openDriveModal = function () {
    openModal(`

        <div style="background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px; padding:12px; font-size:13px;">

        </div>

        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          <button class="btn-primary" onclick="performCloudBackup(false)">☁️ Backup Now to Google Drive</button>
          <button class="btn-secondary" onclick="listGoogleDriveBackups()">📥 Browse &amp; Restore from Drive</button>
          <button class="btn-secondary" onclick="exportLibraryBackupFile()">📤 Share to Google Drive iOS App</button>

        </div>

        <div style="border-top:1px solid var(--border); padding-top:12px;">

          <select id="driveAutoSel" class="form-select" onchange="setDriveAuto(this.value)">
            <option value="off" ${settings.driveAutoBackup==='off'?'selected':''}>Manual Backup Only</option>
            <option value="onedit" ${settings.driveAutoBackup==='onedit'?'selected':''}>Auto-Backup After Edits (15s debounce)</option>
            <option value="5min" ${settings.driveAutoBackup==='5min'?'selected':''}>Every 5 Minutes</option>
          </select>

        <div style="border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--bg-elevated);">
          <div style="font-weight:800; font-size:14px; margin-bottom:6px;">Option 1 (Easiest, Never Expires): Google Drive Web App URL</div>
          <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">
            Deploy the 1-file Google Apps Script below at <code>script.google.com</code> (Execute as: Me, Access: Anyone) so GoodNotes Pro can save &amp; restore directly inside your Google Drive <code>/GoodNotesPro_Backups</code> folder forever!
          </div>
          <input id="driveScriptUrlInput" class="form-input" placeholder="https://script.google.com/macros/s/.../exec" value="${escHtml(settings.driveAppsScriptUrl || '')}"
            oninput="setDriveScriptUrl(this.value)" />
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn-secondary" onclick="copyAppsScriptCode()">📋 Copy Google Drive Script</button>
          </div>
        </div>

        <div style="border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--bg-elevated);">
          <div style="font-weight:800; font-size:14px; margin-bottom:6px;">Option 2: Direct Google Drive OAuth Access Token</div>
          <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">
            Paste a Google OAuth2 token (with <code>drive.file</code> scope) to upload directly via Google Drive REST API v3.
          </div>
          <input id="driveTokenInput" class="form-input" type="password" placeholder="ya29.a0..." value="${escHtml(settings.driveAccessToken || '')}"
            oninput="setDriveToken(this.value)" />
        </div>

        <div id="driveBackupsList"></div>
      </div>`);
  };

  window.copyAppsScriptCode = function () {
    navigator.clipboard?.writeText(PRESETS.GOOGLE_APPS_SCRIPT_TEMPLATE);
    showToast('Google Apps Script copied to clipboard!');
  };

  window.performCloudBackup = async function (silent = false) {
    const json = JSON.stringify({ app: 'GoodNotesPro', version: 1, exportedAt: new Date().toISOString(), data: state });
    const filename = 'GoodNotesPro_Library_Backup.goodnotes.json';

    if (settings.driveAppsScriptUrl) {
      try {
        if (!silent) showToast('Uploading backup to Google Drive...');
        const resp = await fetch(settings.driveAppsScriptUrl, {
          method: 'POST',
          body: JSON.stringify({ filename, content: json, overwrite: true })
        });
        const data = await resp.json();
        if (data && data.ok) {
          settings.lastBackupAt = Date.now();
          saveSettings();
          updateCloudBadges();
          if (!silent) showToast('☁️ Backed up to Google Drive!');
          return;
        }
        throw new Error('Unexpected response from Web App');
      } catch (err) {
        if (!silent) showToast('Drive backup failed: ' + err.message);
        return;
      }
    }

    if (settings.driveAccessToken) {
      try {
        if (!silent) showToast('Uploading to Google Drive API v3...');
        const folderId = await ensureDriveApiFolder(settings.driveAccessToken);
        const existingId = await findDriveApiFile(settings.driveAccessToken, folderId, filename);
        const metadata = existingId ? { name: filename } : { name: filename, parents: [folderId] };
        const boundary = 'gnp_boundary_' + Date.now();
        const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`;
        const url = existingId
          ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
          : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
        const resp = await fetch(url, {
          method: existingId ? 'PATCH' : 'POST',
          headers: {
            Authorization: 'Bearer ' + settings.driveAccessToken,
            'Content-Type': `multipart/related; boundary=${boundary}`
          },
          body
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        settings.lastBackupAt = Date.now();
        saveSettings();
        updateCloudBadges();
        if (!silent) showToast('☁️ Uploaded to Google Drive (/GoodNotesPro_Backups)!');
        return;
      } catch (err) {
        if (!silent) showToast('Drive API error: ' + err.message);
        return;
      }
    }

    if (!silent) {
      exportLibraryBackupFile();
      showToast('Tip: Tap "Google Drive" in the Share sheet, or paste a Drive Web App URL above!');
    }
  };

  async function ensureDriveApiFolder(token) {
    const q = encodeURIComponent("name='GoodNotesPro_Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const d = await r.json();
    if (d.files && d.files.length) return d.files[0].id;
    const cr = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'GoodNotesPro_Backups', mimeType: 'application/vnd.google-apps.folder' })
    });
    const cd = await cr.json();
    return cd.id;
  }

  async function findDriveApiFile(token, folderId, name) {
    const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
    const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const d = await r.json();
    return d.files && d.files[0] ? d.files[0].id : null;
  }

  window.listGoogleDriveBackups = async function () {
    const host = $('driveBackupsList');
    host.innerHTML = '<div style="color:var(--text-muted);">Loading backups from Google Drive...</div>';
    try {
      let files = [];
      if (settings.driveAppsScriptUrl) {
        const r = await fetch(settings.driveAppsScriptUrl + '?action=list');
        const d = await r.json();
        files = d.files || [];
      } else if (settings.driveAccessToken) {
        const fid = await ensureDriveApiFolder(settings.driveAccessToken);
        const q = encodeURIComponent(`'${fid}' in parents and trashed=false`);
        const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime,size)`, {
          headers: { Authorization: 'Bearer ' + settings.driveAccessToken }
        });
        const d = await r.json();
        files = d.files || [];
      } else {
        host.innerHTML = '<div style="color:var(--amber);">Connect a Google Drive Web App URL or OAuth Access Token first.</div>';
        return;
      }

      if (!files.length) {
        host.innerHTML = '<div style="color:var(--text-muted);">No backup files found in /GoodNotesPro_Backups yet.</div>';
        return;
      }

      host.innerHTML = `<div class="form-label">Backups Found in Google Drive</div>` + files.map(f => `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:var(--bg-elevated); border-radius:10px; margin-bottom:6px;">
          <div><strong>${escHtml(f.name)}</strong><div style="font-size:11px; color:var(--text-muted);">${new Date(f.modifiedTime).toLocaleString()}</div></div>
          <button class="btn-primary" style="padding:6px 12px; font-size:12px;" onclick="restoreDriveFile('${f.id}')">Restore</button>
        </div>`).join('');
    } catch (err) {
      host.innerHTML = `<div style="color:var(--red);">Failed to load Drive list: ${escHtml(err.message)}</div>`;
    }
  };

  window.restoreDriveFile = async function (fileId) {
    try {
      showToast('Downloading backup from Google Drive...');
      if (settings.driveAppsScriptUrl) {
        const r = await fetch(settings.driveAppsScriptUrl + '?action=get&id=' + encodeURIComponent(fileId));
        const d = await r.json();
        if (d.content) { restoreFromBackupJsonString(d.content); closeModal(); }
      } else if (settings.driveAccessToken) {
        const r = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`, {
          headers: { Authorization: 'Bearer ' + settings.driveAccessToken }
        });
        const txt = await r.text();
        restoreFromBackupJsonString(txt);
        closeModal();
      }
    } catch (err) {
      alert('Restore error: ' + err.message);
    }
  };

  // -------------------- POPOVER, MODAL & GEOMETRY HELPERS --------------------
  function showPopover(anchorEl, html) {

    const r = anchorEl.getBoundingClientRect();
    const pw = 296;
    const left = Math.max(12, Math.min(window.innerWidth - pw - 12, r.left + r.width / 2 - pw / 2));
    const top = Math.min(window.innerHeight - 160, r.bottom + 8);

    const pop = $('popoverHost');
    if (!pop.classList.contains('hidden') && !pop.contains(e.target) && !e.target.closest('.tool-btn') && !e.target.closest('.icon-btn') && !e.target.closest('.btn-primary') && !e.target.closest('.card-more-btn')) {
      closePopover();
    }

  function openModal(html) {
    $('modalCard').innerHTML = html;
    $('modalBackdrop').classList.remove('hidden');
  }
  window.closeModal = function () { $('modalBackdrop').classList.add('hidden'); };

  function getPointsBounds(pts) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pts) {
      if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
    }
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  function getStrokeBounds(s) {
    if (s.shape) {
      const sh = s.shape;
      if ('x1' in sh) return { x: Math.min(sh.x1, sh.x2), y: Math.min(sh.y1, sh.y2), w: Math.abs(sh.x2 - sh.x1), h: Math.abs(sh.y2 - sh.y1) };
      if ('cx' in sh) return { x: sh.cx - sh.rx, y: sh.cy - sh.ry, w: sh.rx * 2, h: sh.ry * 2 };
      return { x: sh.x, y: sh.y, w: sh.w, h: sh.h };
    }
    return getPointsBounds(s.points);
  }

  function boxesIntersect(a, b) {
    return a.x <= b.x + b.w && a.x + a.w >= b.x && a.y <= b.y + b.h && a.y + a.h >= b.y;
  }

  function pointInBox(p, b, pad = 0) {
    return p.x >= b.x - pad && p.x <= b.x + b.w + pad && p.y >= b.y - pad && p.y <= b.y + b.h + pad;
  }

  function pathLength(pts) {
    let total = 0;
    for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    return total;
  }

  function distToSegment(p, a, b) {
    const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
    if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
    const t = Math.max(0, Math.min(1, ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2));
    return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
  }

  function fmtSec(sec) {
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  window.addEventListener('resize', () => {
    if (!$('editorView').classList.contains('hidden')) fitPageToStage();
  });

  init();
})();
