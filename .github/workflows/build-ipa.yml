name: Build iOS IPA (No Mac Required)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build OxbridgeInterviewAI.ipa on Cloud Mac
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm install

      - name: Regenerate question database & HTML bundle
        run: |
          python scripts/generate_questions.py
          python scripts/bundle_html.py

      - name: Run Expo Prebuild for iOS
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build Release .app (No paid Apple Dev cert needed for sideloading)
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package .app into OxbridgeInterviewAI.ipa
        run: |
          mkdir -p ipa_out/Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built .app bundle"
            exit 1
          fi
          cp -R "$APP_PATH" ipa_out/Payload/
          cd ipa_out
          zip -r ../OxbridgeInterviewAI.ipa Payload
          cd ..
          ls -lh OxbridgeInterviewAI.ipa

      - name: Upload downloadable .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: OxbridgeInterviewAI-ipa
          path: OxbridgeInterviewAI.ipa
          retention-days: 30
