name: GoodNotesPro
options:
  bundleIdPrefix: com.goodnotespro
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"

targets:
  GoodNotesPro:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: GoodNotesPro
        PRODUCT_BUNDLE_IDENTIFIER: com.goodnotespro.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
