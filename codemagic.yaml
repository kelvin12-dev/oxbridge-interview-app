workflows:
  ios-ipa-workflow:
    name: Oxbridge Interview AI - iOS IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Bundle web app and questions into React Native
        script: |
          python3 scripts/generate_questions.py
          python3 scripts/bundle_html.py
      - name: Expo Prebuild iOS
        script: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS .app and package .ipa
        script: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p ../ipa_out/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app ../ipa_out/Payload/
          cd ../ipa_out
          zip -r ../OxbridgeInterviewAI.ipa Payload
    artifacts:
      - OxbridgeInterviewAI.ipa
